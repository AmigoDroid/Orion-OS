set timeout=3
set default=0

insmod all_video
insmod gfxterm
set gfxmode=1280x720x32,1024x768x32,800x600x32,auto
set gfxpayload=keep
terminal_output gfxterm

# O header Multiboot do kernel (arch/i386/entry.asm) pede modo grafico, e o
# GRUB obedece o header mesmo com gfxpayload=text. Para o modo texto VGA use
# o bootloader proprio (make run BOOT=native).
menuentry "Orion OS (OrionGFD)" {
    multiboot /boot/orion.elf
    boot
}
